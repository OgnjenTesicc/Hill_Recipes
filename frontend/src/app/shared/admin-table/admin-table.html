<div class="admin-table">
  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Search recipes</mat-label>
    <input
      matInput
      (input)="applyFilter($event)"
      placeholder="Enter recipe name..."
    />
  </mat-form-field>

  <div class="table-container">
    <table mat-table [dataSource]="dataSource" matSort>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Recipe</th>
        <td mat-cell *matCellDef="let recipe">{{ recipe.name }}</td>
      </ng-container>

      <ng-container matColumnDef="category">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Category</th>
        <td mat-cell *matCellDef="let recipe">{{ recipe.category }}</td>
      </ng-container>

      <ng-container matColumnDef="difficulty">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Difficulty</th>
        <td mat-cell *matCellDef="let recipe">{{ recipe.difficulty }}</td>
      </ng-container>

      <ng-container matColumnDef="time">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Time (min)</th>
        <td mat-cell *matCellDef="let recipe">{{ recipe.time }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>

  <mat-paginator
    [pageSize]="5"
    [pageSizeOptions]="[5, 10]"
    showFirstLastButtons
  />
</div>
