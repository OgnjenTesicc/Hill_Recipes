<h2 mat-dialog-title>Are you sure?</h2>

<mat-dialog-content>
  Do you really want to continue with this action?
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">No</button>
  <button mat-flat-button color="primary" (click)="confirm()">Yes</button>
</mat-dialog-actions>
